[package]
name = "wavedb-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
trybuild.workspace = true
wavedb-core = { path = "../wavedb-core" }
wavedb = { path = "../wavedb" }
serde.workspace = true
postcard.workspace = true
