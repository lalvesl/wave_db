[package]
name = "wavedb-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wavedb = { path = "../wavedb", default-features = false, features = ["wasm"] }

# WASM-only dependencies — compiled only when targeting wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
gloo-net = { workspace = true }
gloo-storage = { workspace = true }
js-sys = { workspace = true }

futures = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wavedb-net = { path = "../wavedb-net", default-features = false }
web-sys = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
